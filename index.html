<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>An Giang Trip</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏕️ An Giang Trip</h1>

    <div class="card">
      <h2>🗺️ Lịch trình</h2>
      <p>Đang tải...</p>
    </div>

    <div class="card">
      <h2>👥 Thành viên</h2>
      <p>Đang tải...</p>
    </div>

    <div class="card">
      <h2>💰 Chi tiêu</h2>
      <p>Đang tải...</p>
    </div>

    <div class="card">
      <h2>🎒 Checklist</h2>
      <p>Đang tải...</p>
    </div>

  </div>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzjrWg18zOpry0s4GlxBhyVT2OvdiCU4p6w6DFTR4lNqJTsp6aw_mbt6nJecV60GCVx/exec';
  
    async function loadData() {
      try {
        const response = await fetch(API_URL + '?action=all');
        const data = await response.json();
  
        console.log('Dữ liệu Google Sheet:', data);
  
        document.querySelector('.card:nth-of-type(1) p').textContent =
          `Đã tải ${data.schedule.rows.length} dòng lịch trình`;
  
        document.querySelector('.card:nth-of-type(2) p').textContent =
          `Đã tải ${data.members.rows.length - 1} thành viên`;
  
        document.querySelector('.card:nth-of-type(3) p').textContent =
          `Đã tải ${data.expenses.rows.length - 1} khoản chi`;
  
        document.querySelector('.card:nth-of-type(4) p').textContent =
          `Đã tải ${data.checklist.rows.length} món checklist`;
  
      } catch (error) {
        console.error(error);
      }
    }
  
    loadData();
  </script>
</body>
</html>
