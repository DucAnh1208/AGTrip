<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>An Giang Trip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: linear-gradient(135deg, #166534, #15803d);
      color: white;
      padding: 22px 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title {
      font-size: 23px;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      opacity: .85;
    }

    .refresh-btn {
      border: 0;
      background: rgba(255,255,255,.18);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
    }

    .refresh-btn:active {
      transform: scale(.95);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px 14px 90px;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    /* =========================
       DAY
    ========================= */

    .day-title {
      margin: 10px 0 12px;
      padding: 12px 15px;
      border-radius: 14px;
      background: #dcfce7;
      color: #166534;
      font-weight: 800;
      font-size: 17px;
    }

    /* =========================
       SCHEDULE
    ========================= */

    .schedule-card {
      background: white;
      border-radius: 15px;
      margin-bottom: 10px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      border-left: 4px solid #22c55e;
    }

    .schedule-time {
      font-size: 13px;
      font-weight: 800;
      color: #16a34a;
      margin-bottom: 5px;
    }

    .schedule-location {
      font-size: 16px;
      font-weight: 750;
      margin-bottom: 7px;
    }

    .schedule-detail {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.55;
      white-space: pre-line;
    }

    .schedule-note {
      margin-top: 9px;
      padding: 8px 10px;
      background: #fff7ed;
      border-radius: 9px;
      color: #9a3412;
      font-size: 13px;
    }

    .cost-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .cost-tag {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
    }

    /* =========================
       SECTION HEADER
    ========================= */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 800;
      margin: 0;
    }

    /* =========================
       MEMBERS
    ========================= */

    .member-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .member-name {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .member-options {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 11px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    .check-label input {
      width: 19px;
      height: 19px;
      accent-color: #16a34a;
    }

    .note-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 9px 10px;
      outline: none;
    }

    .note-input:focus {
      border-color: #22c55e;
    }

    .save-member {
      margin-top: 9px;
      border: 0;
      background: #166534;
      color: white;
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 13px;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
    }
    
    .member-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* =========================
       EXPENSE
    ========================= */

    .expense-summary {
      background: linear-gradient(135deg, #166534, #22c55e);
      color: white;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .expense-summary-label {
      font-size: 13px;
      opacity: .85;
    }

    .expense-total {
      font-size: 27px;
      font-weight: 850;
      margin-top: 4px;
    }

    .add-btn {
      border: 0;
      background: #166534;
      color: white;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .expense-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 9px;
      box-shadow: 0 2px 7px rgba(0,0,0,.05);
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-description {
      font-weight: 750;
    }

    .expense-amount {
      color: #dc2626;
      font-weight: 800;
      white-space: nowrap;
    }

    .expense-meta {
      font-size: 12px;
      color: #6b7280;
      margin-top: 7px;
    }

    .expense-note {
      margin-top: 7px;
      font-size: 13px;
      color: #4b5563;
    }

    /* =========================
       CHECKLIST
    ========================= */

    .checklist-card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 7px rgba(0,0,0,.05);
    }

    .checklist-card input {
      width: 21px;
      height: 21px;
      accent-color: #16a34a;
      flex-shrink: 0;
    }

    .checklist-text {
      flex: 1;
      font-size: 15px;
    }

    .checklist-text.done {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-check {
      border: 0;
      background: #fee2e2;
      color: #dc2626;
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    /* =========================
       FORM
    ========================= */

    .form-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .form-title {
      font-weight: 800;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #374151;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 10px;
      outline: none;
      background: white;
    }

    .form-group textarea {
      min-height: 70px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #22c55e;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    .primary-btn {
      flex: 1;
      border: 0;
      background: #166534;
      color: white;
      border-radius: 10px;
      padding: 11px;
      font-weight: 700;
    }

    .secondary-btn {
      border: 0;
      background: #e5e7eb;
      color: #374151;
      border-radius: 10px;
      padding: 11px 15px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      border-radius: 14px;
      padding: 30px 15px;
      text-align: center;
      color: #9ca3af;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      z-index: 30;
      box-shadow: 0 -3px 15px rgba(0,0,0,.06);
    }

    .nav-inner {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      border: 0;
      background: white;
      color: #9ca3af;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: #166534;
      font-weight: 700;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {
      main {
        padding-left: 20px;
        padding-right: 20px;
      }

      .schedule-card {
        padding: 17px;
      }

      .member-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div>
        <div class="title">🌴 AG Trip</div>
        <div class="subtitle">An Giang • 10–11/10/2026</div>
      </div>

      <button class="refresh-btn" onclick="loadAll()" title="Làm mới">
        ↻
      </button>
    </div>
  </header>


  <!-- MAIN -->
  <main>

    <!-- =========================
         LỊCH TRÌNH
    ========================== -->
    <section id="tab-schedule" class="tab active">

      <div class="section-header">
        <h2 class="section-title">🗺️ Lịch trình</h2>
      </div>

      <div id="schedule-content">
        <div class="loading">Đang tải lịch trình...</div>
      </div>

    </section>


    <!-- =========================
         THÀNH VIÊN
    ========================== -->
    <section id="tab-members" class="tab">

      <div class="section-header">
        <h2 class="section-title">👥 Thành viên</h2>
      </div>

      <div id="members-content">
        <div class="loading">Đang tải thành viên...</div>
      </div>

    </section>


    <!-- =========================
         CHI TIÊU
    ========================== -->
    <section id="tab-expenses" class="tab">

      <div class="section-header">
        <h2 class="section-title">💰 Chi tiêu</h2>

        <button class="add-btn" onclick="showExpenseForm()">
          + Thêm
        </button>
      </div>

      <div id="expense-form-container"></div>

      <div id="expenses-content">
        <div class="loading">Đang tải chi tiêu...</div>
      </div>

    </section>


    <!-- =========================
         CHECKLIST
    ========================== -->
    <section id="tab-checklist" class="tab">

      <div class="section-header">
        <h2 class="section-title">🎒 Checklist</h2>

        <button class="add-btn" onclick="showChecklistForm()">
          + Thêm
        </button>
      </div>

      <div id="checklist-form-container"></div>

      <div id="checklist-content">
        <div class="loading">Đang tải checklist...</div>
      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <div class="nav-inner">

      <button class="nav-btn active" onclick="switchTab('schedule', this)">
        <span class="nav-icon">🗺️</span>
        <span>Lịch trình</span>
      </button>

      <button class="nav-btn" onclick="switchTab('members', this)">
        <span class="nav-icon">👥</span>
        <span>Thành viên</span>
      </button>

      <button class="nav-btn" onclick="switchTab('expenses', this)">
        <span class="nav-icon">💰</span>
        <span>Chi tiêu</span>
      </button>

      <button class="nav-btn" onclick="switchTab('checklist', this)">
        <span class="nav-icon">🎒</span>
        <span>Checklist</span>
      </button>

    </div>

  </nav>


<script>

  /* =====================================================
     CONFIG
  ===================================================== */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbzjrWg18zOpry0s4GlxBhyVT2OvdiCU4p6w6DFTR4lNqJTsp6aw_mbt6nJecV60GCVx/exec';


  /* =====================================================
     DATA
  ===================================================== */

  let appData = {
    schedule: [],
    members: [],
    expenses: [],
    checklist: []
  };


  /* =====================================================
     INIT
  ===================================================== */

  document.addEventListener('DOMContentLoaded', () => {
    loadAll();
  });


  /* =====================================================
     GET API
  ===================================================== */

  async function getData(action) {

    const response = await fetch(
      API_URL + '?action=' + encodeURIComponent(action)
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    return await response.json();
  }


  /* =====================================================
     POST API
  ===================================================== */

  async function postData(data) {

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    return await response.json();
  }


  /* =====================================================
     LOAD ALL
  ===================================================== */

  async function loadAll() {

    setLoading();

    try {

      const data = await getData('all');

      if (!data.success) {
        throw new Error(data.error || 'API error');
      }

      appData.schedule =
        data.schedule?.rows || [];

      appData.members =
        data.members?.rows || [];

      appData.expenses =
        data.expenses?.rows || [];

      appData.checklist =
        data.checklist?.rows || [];


      renderSchedule();
      renderMembers();
      renderExpenses();
      renderChecklist();

    } catch (error) {

      console.error(error);

      showGlobalError(
        'Không tải được dữ liệu. Kiểm tra Apps Script hoặc thử tải lại trang.'
      );

    }
  }


  /* =====================================================
     LOADING
  ===================================================== */

  function setLoading() {

    document.getElementById('schedule-content').innerHTML =
      '<div class="loading">Đang tải lịch trình...</div>';

    document.getElementById('members-content').innerHTML =
      '<div class="loading">Đang tải thành viên...</div>';

    document.getElementById('expenses-content').innerHTML =
      '<div class="loading">Đang tải chi tiêu...</div>';

    document.getElementById('checklist-content').innerHTML =
      '<div class="loading">Đang tải checklist...</div>';
  }


  function showGlobalError(message) {

    const html =
      '<div class="error">' +
      escapeHtml(message) +
      '</div>';

    document.getElementById('schedule-content').innerHTML = html;
    document.getElementById('members-content').innerHTML = html;
    document.getElementById('expenses-content').innerHTML = html;
    document.getElementById('checklist-content').innerHTML = html;
  }


  /* =====================================================
     TAB
  ===================================================== */

  function switchTab(name, button) {

    document
      .querySelectorAll('.tab')
      .forEach(tab => tab.classList.remove('active'));

    document
      .getElementById('tab-' + name)
      .classList.add('active');

    document
      .querySelectorAll('.nav-btn')
      .forEach(btn => btn.classList.remove('active'));

    button.classList.add('active');

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }


  /* =====================================================
     SCHEDULE
  ===================================================== */

  function renderSchedule() {

    const container =
      document.getElementById('schedule-content');

    const rows = appData.schedule;

    if (!rows.length) {
      container.innerHTML =
        '<div class="empty">Chưa có lịch trình.</div>';

      return;
    }


    let html = '';

    for (let i = 1; i < rows.length; i++) {

      const row = rows[i];

      if (!row || !row.length) {
        continue;
      }

      const firstCell =
        String(row[0] ?? '').trim();

      if (!firstCell &&
          !String(row[1] ?? '').trim() &&
          !String(row[2] ?? '').trim()) {
        continue;
      }


      /* DAY 1 / DAY 2 */

      if (
        firstCell.toUpperCase().startsWith('DAY')
      ) {

        html +=
          '<div class="day-title">' +
          escapeHtml(firstCell) +
          '</div>';

        continue;
      }


      const time =
        row[0] ?? '';

      const location =
        row[1] ?? '';

      const detail =
        row[2] ?? '';

      const planCost =
        row[3] ?? '';

      const totalCost =
        row[4] ?? '';

      const note =
        row[5] ?? '';


      html += `
        <div class="schedule-card">

          <div class="schedule-time">
            ${escapeHtml(formatValue(time))}
          </div>

          <div class="schedule-location">
            ${escapeHtml(formatValue(location))}
          </div>

          <div class="schedule-detail">
            ${escapeHtml(formatValue(detail))}
          </div>

          ${
            note
              ? `
                <div class="schedule-note">
                  📝 ${escapeHtml(formatValue(note))}
                </div>
              `
              : ''
          }

          ${
            planCost || totalCost
              ? `
                <div class="cost-tags">

                  ${
                    planCost
                      ? `<span class="cost-tag">
                           Plan: ${escapeHtml(formatValue(planCost))}
                         </span>`
                      : ''
                  }

                  ${
                    totalCost
                      ? `<span class="cost-tag">
                           Tổng: ${escapeHtml(formatValue(totalCost))}
                         </span>`
                      : ''
                  }

                </div>
              `
              : ''
          }

        </div>
      `;
    }

    container.innerHTML = html;
  }


  /* =====================================================
     MEMBERS
  ===================================================== */

  function renderMembers() {
  
    const container =
      document.getElementById('members-content');
  
    const rows =
      appData.members;
  
    if (!rows.length) {
      container.innerHTML =
        '<div class="empty">Chưa có thành viên.</div>';
      return;
    }
  
  
    let html = '';
  
    let stt = 1;
  
  
    for (let i = 1; i < rows.length; i++) {
  
      const row = rows[i];
  
      if (!row) continue;
  
      const name =
        String(row[1] ?? '').trim();
  
      if (!name) continue;
  
  
      const note =
        String(row[2] ?? '');
  
      const sheetRow =
        i + 1;
  
  
      html += `
        <div class="member-card"
             data-member-row="${sheetRow}">
  
          <div class="member-row">
  
            <div class="member-number">
              ${stt}
            </div>
  
            <div class="member-name">
              ${escapeHtml(name)}
            </div>
  
          </div>
  
          <input
            type="text"
            class="note-input member-note"
            value="${escapeAttribute(note)}"
            placeholder="Note..."
          >
  
          <button
            class="save-member"
            onclick="saveMember(this)"
          >
            💾 Lưu
          </button>
  
        </div>
      `;
  
      stt++;
    }
  
  
    if (!html) {
      html =
        '<div class="empty">Chưa có thành viên.</div>';
    }
  
    container.innerHTML = html;
  }
  
  
  async function saveMember(button) {
  
    const card =
      button.closest('.member-card');
  
    const row =
      Number(card.dataset.memberRow);
  
    const note =
      card.querySelector('.member-note').value;
  
  
    button.disabled = true;
    button.textContent = 'Đang lưu...';
  
  
    try {
  
      const result =
        await postData({
          action: 'updateMember',
          row: row,
          note: note
        });
  
  
      if (!result.success) {
        throw new Error(
          result.error || 'Không thể cập nhật'
        );
      }
  
  
      button.textContent = '✓ Đã lưu';
  
  
      setTimeout(() => {
  
        button.textContent = '💾 Lưu';
        button.disabled = false;
  
      }, 1000);
  
  
    } catch (error) {
  
      console.error(error);
  
      alert('Không lưu được ghi chú.');
  
      button.textContent = '💾 Lưu';
      button.disabled = false;
    }
  }


  /* =====================================================
     EXPENSE FORM
  ===================================================== */

  function showExpenseForm() {

    const container =
      document.getElementById('expense-form-container');


    const memberNames = getMemberNames();


    let options =
      '<option value="">-- Chọn người trả --</option>';

    memberNames.forEach(name => {
      options +=
        `<option value="${escapeAttribute(name)}">
          ${escapeHtml(name)}
        </option>`;
    });


    container.innerHTML = `

      <div class="form-card">

        <div class="form-title">
          ➕ Thêm khoản chi
        </div>

        <form onsubmit="submitExpense(event)">

          <div class="form-group">

            <label>Thời gian</label>

            <input
              type="datetime-local"
              id="expense-time"
              value="${getCurrentDateTimeLocal()}"
            >

          </div>


          <div class="form-group">

            <label>Nội dung</label>

            <input
              type="text"
              id="expense-description"
              placeholder="Ví dụ: Mua bia"
              required
            >

          </div>


          <div class="form-group">

            <label>Số tiền</label>

            <input
              type="number"
              id="expense-amount"
              placeholder="Ví dụ: 500000"
              min="0"
              required
            >

          </div>


          <div class="form-group">

            <label>Người trả</label>

            <select id="expense-payer">
              ${options}
            </select>

          </div>


          <div class="form-group">

            <label>Ghi chú</label>

            <textarea
              id="expense-note"
              placeholder="Không bắt buộc"
            ></textarea>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="primary-btn"
            >
              Lưu khoản chi
            </button>

            <button
              type="button"
              class="secondary-btn"
              onclick="hideExpenseForm()"
            >
              Hủy
            </button>

          </div>

        </form>

      </div>
    `;
  }


  function hideExpenseForm() {

    document.getElementById(
      'expense-form-container'
    ).innerHTML = '';
  }


  async function submitExpense(event) {

    event.preventDefault();


    const time =
      document.getElementById('expense-time').value;

    const description =
      document.getElementById('expense-description').value.trim();

    const amount =
      Number(document.getElementById('expense-amount').value);

    const payer =
      document.getElementById('expense-payer').value;

    const note =
      document.getElementById('expense-note').value.trim();


    if (!description) {
      alert('Vui lòng nhập nội dung.');
      return;
    }


    if (!amount || amount < 0) {
      alert('Vui lòng nhập số tiền.');
      return;
    }


    try {

      const result = await postData({
        action: 'addExpense',
        time: time,
        description: description,
        amount: amount,
        payer: payer,
        note: note
      });


      if (!result.success) {
        throw new Error(result.error || 'Không thể thêm khoản chi');
      }


      hideExpenseForm();

      await loadAll();

    } catch (error) {

      console.error(error);

      alert('Không thêm được khoản chi.');
    }
  }


  /* =====================================================
     CHECKLIST
  ===================================================== */

  function renderChecklist() {

    const container =
      document.getElementById('checklist-content');

    const rows =
      appData.checklist;


    let html = '';


    for (let i = 0; i < rows.length; i++) {

      const row =
        rows[i];

      if (!row) continue;


      let raw =
        String(row[0] ?? '').trim();

      if (!raw) continue;


      const checked =
        raw.startsWith('✓ ');

      const text =
        checked
          ? raw.substring(2)
          : raw;


      const sheetRow =
        i + 1;


      html += `

        <div class="checklist-card">

          <input
            type="checkbox"
            ${checked ? 'checked' : ''}
            onchange="toggleChecklist(
              ${sheetRow},
              this.checked,
              ${JSON.stringify(text)}
            )"
          >

          <div
            class="checklist-text ${checked ? 'done' : ''}"
          >
            ${escapeHtml(text)}
          </div>

          <button
            class="delete-check"
            onclick="deleteChecklistItem(${sheetRow})"
            title="Xóa"
          >
            ×
          </button>

        </div>
      `;
    }


    container.innerHTML =
      html ||
      '<div class="empty">Chưa có checklist.</div>';
  }


  async function toggleChecklist(
    row,
    checked,
    text
  ) {

    const value =
      checked
        ? '✓ ' + text
        : text;


    try {

      const result = await postData({
        action: 'updateChecklist',
        row: row,
        value: value
      });


      if (!result.success) {
        throw new Error(result.error || 'Không thể cập nhật');
      }


      await loadAll();

    } catch (error) {

      console.error(error);

      alert('Không cập nhật được checklist.');

      await loadAll();
    }
  }


  /* =====================================================
     CHECKLIST FORM
  ===================================================== */

  function showChecklistForm() {

    const container =
      document.getElementById(
        'checklist-form-container'
      );


    container.innerHTML = `

      <div class="form-card">

        <div class="form-title">
          ➕ Thêm checklist
        </div>

        <form onsubmit="submitChecklist(event)">

          <div class="form-group">

            <label>Món cần chuẩn bị</label>

            <input
              type="text"
              id="checklist-item"
              placeholder="Ví dụ: Kem chống nắng"
              required
              autofocus
            >

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="primary-btn"
            >
              Thêm
            </button>

            <button
              type="button"
              class="secondary-btn"
              onclick="hideChecklistForm()"
            >
              Hủy
            </button>

          </div>

        </form>

      </div>
    `;
  }


  function hideChecklistForm() {

    document.getElementById(
      'checklist-form-container'
    ).innerHTML = '';
  }


  async function submitChecklist(event) {

    event.preventDefault();


    const item =
      document.getElementById(
        'checklist-item'
      ).value.trim();


    if (!item) {
      alert('Vui lòng nhập nội dung.');
      return;
    }


    try {

      const result = await postData({
        action: 'addChecklist',
        item: item
      });


      if (!result.success) {
        throw new Error(result.error || 'Không thể thêm');
      }


      hideChecklistForm();

      await loadAll();

    } catch (error) {

      console.error(error);

      alert('Không thêm được checklist.');
    }
  }


  /* =====================================================
     DELETE CHECKLIST
  ===================================================== */

  async function deleteChecklistItem(row) {

    if (!confirm('Xóa món này khỏi checklist?')) {
      return;
    }


    try {

      const result = await postData({
        action: 'deleteChecklist',
        row: row
      });


      if (!result.success) {
        throw new Error(result.error || 'Không thể xóa');
      }


      await loadAll();

    } catch (error) {

      console.error(error);

      alert('Không xóa được checklist.');
    }
  }


  /* =====================================================
     HELPERS
  ===================================================== */

  function getMemberNames() {

    const names = [];

    for (let i = 1; i < appData.members.length; i++) {

      const name =
        String(
          appData.members[i]?.[1] ?? ''
        ).trim();

      if (name) {
        names.push(name);
      }
    }

    return names;
  }


  function formatMoney(value) {

    const number =
      Number(value) || 0;

    return new Intl.NumberFormat(
      'vi-VN'
    ).format(number) + ' ₫';
  }


  function formatValue(value) {

    if (value === null || value === undefined) {
      return '';
    }

    return String(value);
  }


  function formatDateTime(value) {

    if (!value) {
      return '';
    }


    const str =
      String(value);


    /*
      Nếu Apps Script trả ISO date
    */

    const date =
      new Date(str);


    if (!isNaN(date.getTime())) {

      return date.toLocaleString(
        'vi-VN',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }
      );
    }


    return str;
  }


  function getCurrentDateTimeLocal() {

    const now =
      new Date();


    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1)
        .padStart(2, '0');

    const day =
      String(now.getDate())
        .padStart(2, '0');

    const hours =
      String(now.getHours())
        .padStart(2, '0');

    const minutes =
      String(now.getMinutes())
        .padStart(2, '0');


    return `${year}-${month}-${day}T${hours}:${minutes}`;
  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function escapeAttribute(value) {

    return escapeHtml(value);
  }

</script>
