<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AG Trip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #166534;
      color: white;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    /* =========================
       NAV
    ========================= */

    nav {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 67px;
      z-index: 90;
    }

    nav button {
      flex: 1;
      border: 0;
      background: white;
      padding: 13px 5px;
      font-size: 14px;
      cursor: pointer;
      color: #555;
    }

    nav button.active {
      color: #166534;
      font-weight: bold;
      border-bottom: 3px solid #166534;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .section-title {
      margin: 5px 0 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      color: #888;
    }

    /* =========================
       SCHEDULE
    ========================= */

    .day-title {
      background: #166534;
      color: white;
      padding: 10px 12px;
      border-radius: 10px;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    .schedule-card {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .schedule-time {
      font-weight: bold;
      color: #166534;
      margin-bottom: 4px;
    }

    .schedule-place {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .schedule-detail {
      white-space: pre-line;
      line-height: 1.5;
      color: #444;
    }

    /* =========================
       MEMBERS
    ========================= */

    .member-card {
      display: grid;

      /*
        STT | TÊN | NOTE | SAVE
      */
      grid-template-columns:
        32px
        80px
        minmax(0, 1fr)
        42px;

      column-gap: 10px;

      align-items: center;

      background: white;
      border-radius: 12px;

      padding: 10px 12px;
      margin-bottom: 8px;

      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.05);
    }

    /* STT */

    .member-number {
      text-align: center;
      font-weight: bold;
      color: #777;
      justify-self: center;
    }

    /* TÊN */

    .member-name {
      min-width: 0;

      font-weight: 600;

      overflow-wrap: anywhere;

      /*
        Quan trọng:
        Khi Note cao lên thì Tên vẫn nằm giữa.
      */
      align-self: center;
    }

    /* NOTE */

    .member-note {
      width: 100%;
      min-width: 0;

      min-height: 36px;

      padding: 8px 9px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      background: white;

      outline: none;

      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;

      resize: vertical;

      overflow-wrap: anywhere;
    }

    .member-note:focus {
      border-color: #166534;
      box-shadow: 0 0 0 2px rgba(22, 101, 52, 0.08);
    }

    /* SAVE */

    .save-member {
      width: 38px;
      height: 36px;

      border: 0;
      border-radius: 8px;

      background: #166534;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      font-size: 16px;

      cursor: pointer;

      justify-self: center;
      align-self: center;
    }

    .save-member:hover {
      background: #14532d;
    }

    .save-member:disabled {
      opacity: 0.7;
      cursor: default;
    }

    /* =========================
       EXPENSE
    ========================= */

    .expense-card {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .expense-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-description {
      font-weight: bold;
    }

    .expense-amount {
      font-weight: bold;
      color: #166534;
      white-space: nowrap;
    }

    .expense-info {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .add-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .add-box input,
    .add-box textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .add-box button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #166534;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       CHECKLIST
    ========================= */

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;

      background: white;
      border-radius: 10px;

      padding: 11px 12px;
      margin-bottom: 8px;

      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .checklist-item input {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .checklist-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .checklist-text.checked {
      text-decoration: line-through;
      color: #999;
    }

    .delete-checklist {
      border: 0;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 16px;
    }

    /* =========================
       REFRESH
    ========================= */

    .refresh-btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;

      border: 0;
      border-radius: 8px;

      background: #e5e7eb;
      color: #333;

      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #d1d5db;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      main {
        padding: 10px;
      }

      .member-card {
        grid-template-columns:
          28px
          62px
          minmax(0, 1fr)
          38px;

        column-gap: 7px;

        padding: 9px;
      }

      .member-number {
        font-size: 13px;
      }

      .member-name {
        font-size: 14px;
      }

      .member-note {
        font-size: 14px;
      }

      .save-member {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <h1>AG Trip</h1>
    <p>An Giang 2026</p>
  </header>


  <!-- =========================
       NAV
  ========================= -->

  <nav>
    <button class="nav-btn active" onclick="showTab('schedule', this)">
      Lịch trình
    </button>

    <button class="nav-btn" onclick="showTab('members', this)">
      Thành viên
    </button>

    <button class="nav-btn" onclick="showTab('expenses', this)">
      Chi tiêu
    </button>

    <button class="nav-btn" onclick="showTab('checklist', this)">
      Checklist
    </button>
  </nav>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <button class="refresh-btn" onclick="loadAll()">
      🔄 Tải lại dữ liệu
    </button>


    <!-- =========================
         LỊCH TRÌNH
    ========================= -->

    <section id="schedule" class="tab active">

      <div class="section-title">
        📅 Lịch trình
      </div>

      <div id="schedule-content">
        Đang tải...
      </div>

    </section>


    <!-- =========================
         THÀNH VIÊN
    ========================= -->

    <section id="members" class="tab">

      <div class="section-title">
        👥 Thành viên
      </div>

      <div id="members-content">
        Đang tải...
      </div>

    </section>


    <!-- =========================
         CHI TIÊU
    ========================= -->

    <section id="expenses" class="tab">

      <div class="section-title">
        💰 Chi tiêu
      </div>


      <div class="add-box">

        <input
          id="expense-description"
          type="text"
          placeholder="Nội dung"
        >

        <input
          id="expense-amount"
          type="number"
          placeholder="Số tiền"
        >

        <input
          id="expense-payer"
          type="text"
          placeholder="Người trả"
        >

        <textarea
          id="expense-note"
          rows="2"
          placeholder="Ghi chú"
        ></textarea>

        <button onclick="addExpense()">
          + Thêm khoản chi
        </button>

      </div>


      <div id="expenses-content">
        Đang tải...
      </div>

    </section>


    <!-- =========================
         CHECKLIST
    ========================= -->

    <section id="checklist" class="tab">

      <div class="section-title">
        ✅ Checklist
      </div>


      <div class="add-box">

        <input
          id="checklist-input"
          type="text"
          placeholder="Thêm checklist..."
        >

        <button onclick="addChecklist()">
          + Thêm
        </button>

      </div>


      <div id="checklist-content">
        Đang tải...
      </div>

    </section>

  </main>


  <script>

    /* =========================
       API
    ========================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzjrWg18zOpry0s4GlxBhyVT2OvdiCU4p6w6DFTR4lNqJTsp6aw_mbt6nJecV60GCVx/exec';


    /* =========================
       DATA
    ========================= */

    let appData = {
      schedule: [],
      members: [],
      expenses: [],
      checklist: []
    };


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /* =========================
       TAB
    ========================= */

    function showTab(tabId, button) {

      document.querySelectorAll('.tab')
        .forEach(tab => tab.classList.remove('active'));

      document.querySelectorAll('.nav-btn')
        .forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId)
        .classList.add('active');

      button.classList.add('active');

    }


    /* =========================
       LOAD ALL
    ========================= */

    async function loadAll() {

      try {

        const response = await fetch(
          API_URL + '?action=all'
        );

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'Không tải được dữ liệu');
        }

        appData.schedule =
          result.schedule?.rows || [];

        appData.members =
          result.members?.rows || [];

        appData.expenses =
          result.expenses?.rows || [];

        appData.checklist =
          result.checklist?.rows || [];


        renderSchedule();
        renderMembers();
        renderExpenses();
        renderChecklist();

      } catch (error) {

        console.error(error);

        alert(
          'Không tải được dữ liệu. Kiểm tra Apps Script hoặc thử tải lại trang.'
        );

      }

    }


    /* =========================
       SCHEDULE
    ========================= */

    function renderSchedule() {

      const box =
        document.getElementById('schedule-content');

      let html = '';

      let currentDay = '';

      for (
        let i = 1;
        i < appData.schedule.length;
        i++
      ) {

        const row = appData.schedule[i];

        if (!row) continue;

        const time =
          String(row[0] ?? '').trim();

        const place =
          String(row[1] ?? '').trim();

        const detail =
          String(row[2] ?? '').trim();


        if (time === 'DAY 1' || time === 'DAY 2') {

          currentDay = time;

          html += `
            <div class="day-title">
              ${escapeHtml(time)}
            </div>
          `;

          continue;

        }


        if (
          !time &&
          !place &&
          !detail
        ) {
          continue;
        }


        html += `
          <div class="schedule-card">

            <div class="schedule-time">
              ${escapeHtml(time)}
            </div>

            <div class="schedule-place">
              ${escapeHtml(place)}
            </div>

            <div class="schedule-detail">
              ${escapeHtml(detail)}
            </div>

          </div>
        `;

      }


      box.innerHTML =
        html ||
        '<div class="empty">Chưa có lịch trình.</div>';

    }


    /* =========================
       MEMBERS
    ========================= */

    function renderMembers() {

      const box =
        document.getElementById('members-content');

      let html = '';

      let number = 1;


      /*
        Bỏ header dòng 1.
        Chỉ hiển thị những dòng
        có tên thành viên.
      */

      for (
        let i = 1;
        i < appData.members.length;
        i++
      ) {

        const row =
          appData.members[i];

        if (!row) continue;


        const name =
          String(row[1] ?? '').trim();

        if (!name) continue;


        const note =
          String(row[2] ?? '');


        /*
          i = index trong mảng
          sheet row = i + 1
        */

        const sheetRow =
          i + 1;


        html += `
          <div
            class="member-card"
            data-row="${sheetRow}"
          >

            <div class="member-number">
              ${number}
            </div>

            <div class="member-name">
              ${escapeHtml(name)}
            </div>

            <textarea
              class="member-note"
              placeholder="Note..."
              rows="1"
            >${escapeHtml(note)}</textarea>

            <button
              class="save-member"
              onclick="saveMember(this)"
              title="Lưu"
            >
              💾
            </button>

          </div>
        `;


        number++;

      }


      box.innerHTML =
        html ||
        '<div class="empty">Chưa có thành viên.</div>';

    }


    /* =========================
       SAVE MEMBER
    ========================= */

    async function saveMember(button) {

      const card =
        button.closest('.member-card');

      const row =
        Number(card.dataset.row);

      const note =
        card.querySelector('.member-note').value;


      button.disabled = true;
      button.textContent = '...';


      try {

        const response =
          await fetch(API_URL, {

            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({

              action: 'updateMember',

              row: row,

              note: note

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Lỗi'
          );

        }


        button.textContent = '✓';


        setTimeout(() => {

          button.textContent = '💾';

          button.disabled = false;

        }, 1000);


      } catch (error) {

        console.error(error);

        alert(
          'Không lưu được ghi chú.'
        );

        button.textContent = '💾';

        button.disabled = false;

      }

    }


    /* =========================
       EXPENSES
    ========================= */

    function renderExpenses() {

      const box =
        document.getElementById('expenses-content');

      let html = '';


      /*
        Sheet:
        Thời gian | Nội dung | Số tiền | Người trả | Ghi chú
      */

      for (
        let i = 1;
        i < appData.expenses.length;
        i++
      ) {

        const row =
          appData.expenses[i];

        if (!row) continue;


        const time =
          String(row[0] ?? '');

        const description =
          String(row[1] ?? '');

        const amount =
          Number(row[2] ?? 0);

        const payer =
          String(row[3] ?? '');

        const note =
          String(row[4] ?? '');


        if (
          !description &&
          !amount &&
          !payer &&
          !note
        ) {
          continue;
        }


        html += `
          <div class="expense-card">

            <div class="expense-main">

              <div class="expense-description">
                ${escapeHtml(description)}
              </div>

              <div class="expense-amount">
                ${amount.toLocaleString('vi-VN')} đ
              </div>

            </div>

            <div class="expense-info">

              Người trả:
              ${escapeHtml(payer)}

              ${
                note
                  ? `<br>Ghi chú: ${escapeHtml(note)}`
                  : ''
              }

              ${
                time
                  ? `<br>${escapeHtml(time)}`
                  : ''
              }

            </div>

          </div>
        `;

      }


      box.innerHTML =
        html ||
        '<div class="empty">Chưa có khoản chi.</div>';

    }


    /* =========================
       ADD EXPENSE
    ========================= */

    async function addExpense() {

      const description =
        document.getElementById(
          'expense-description'
        ).value.trim();

      const amount =
        document.getElementById(
          'expense-amount'
        ).value;

      const payer =
        document.getElementById(
          'expense-payer'
        ).value.trim();

      const note =
        document.getElementById(
          'expense-note'
        ).value.trim();


      if (!description) {

        alert('Nhập nội dung khoản chi.');

        return;

      }


      try {

        const response =
          await fetch(API_URL, {

            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({

              action: 'addExpense',

              description: description,

              amount: amount,

              payer: payer,

              note: note

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Lỗi'
          );

        }


        document.getElementById(
          'expense-description'
        ).value = '';

        document.getElementById(
          'expense-amount'
        ).value = '';

        document.getElementById(
          'expense-payer'
        ).value = '';

        document.getElementById(
          'expense-note'
        ).value = '';


        await loadAll();


      } catch (error) {

        console.error(error);

        alert(
          'Không thêm được khoản chi.'
        );

      }

    }


    /* =========================
       CHECKLIST
    ========================= */

    function renderChecklist() {

      const box =
        document.getElementById(
          'checklist-content'
        );

      let html = '';


      for (
        let i = 0;
        i < appData.checklist.length;
        i++
      ) {

        const row =
          appData.checklist[i];

        if (!row) continue;


        let value =
          String(row[0] ?? '').trim();


        if (!value) continue;


        const checked =
          value.startsWith('✓ ');


        const displayText =
          checked
            ? value.substring(2)
            : value;


        const sheetRow =
          i + 1;


        html += `
          <div
            class="checklist-item"
            data-row="${sheetRow}"
          >

            <input
              type="checkbox"
              ${checked ? 'checked' : ''}
              onchange="toggleChecklist(this)"
            >

            <div
              class="checklist-text ${
                checked ? 'checked' : ''
              }"
            >
              ${escapeHtml(displayText)}
            </div>

            <button
              class="delete-checklist"
              onclick="deleteChecklist(this)"
              title="Xóa"
            >
              🗑
            </button>

          </div>
        `;

      }


      box.innerHTML =
        html ||
        '<div class="empty">Chưa có checklist.</div>';

    }


    /* =========================
       ADD CHECKLIST
    ========================= */

    async function addChecklist() {

      const input =
        document.getElementById(
          'checklist-input'
        );

      const item =
        input.value.trim();


      if (!item) return;


      try {

        const response =
          await fetch(API_URL, {

            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({

              action: 'addChecklist',

              item: item

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Lỗi'
          );

        }


        input.value = '';

        await loadAll();


      } catch (error) {

        console.error(error);

        alert(
          'Không thêm được checklist.'
        );

      }

    }


    /* =========================
       TOGGLE CHECKLIST
    ========================= */

    async function toggleChecklist(checkbox) {

      const item =
        checkbox.closest(
          '.checklist-item'
        );

      const row =
        Number(item.dataset.row);

      const text =
        item.querySelector(
          '.checklist-text'
        ).textContent.trim();


      const value =
        checkbox.checked
          ? '✓ ' + text
          : text;


      try {

        const response =
          await fetch(API_URL, {

            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({

              action: 'updateChecklist',

              row: row,

              value: value

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Lỗi'
          );

        }


        item
          .querySelector('.checklist-text')
          .classList.toggle(
            'checked',
            checkbox.checked
          );


      } catch (error) {

        console.error(error);

        checkbox.checked =
          !checkbox.checked;

        alert(
          'Không cập nhật được checklist.'
        );

      }

    }


    /* =========================
       DELETE CHECKLIST
    ========================= */

    async function deleteChecklist(button) {

      if (
        !confirm(
          'Xóa checklist này?'
        )
      ) {
        return;
      }


      const item =
        button.closest(
          '.checklist-item'
        );

      const row =
        Number(item.dataset.row);


      try {

        const response =
          await fetch(API_URL, {

            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({

              action: 'deleteChecklist',

              row: row

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Lỗi'
          );

        }


        await loadAll();


      } catch (error) {

        console.error(error);

        alert(
          'Không xóa được checklist.'
        );

      }

    }


    /* =========================
       START
    ========================= */

    loadAll();

  </script>
