<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>An Giang Trip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    .header {
      background: #166534;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 23px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      opacity: .85;
      margin-top: 4px;
    }

    .refresh-btn {
      border: 0;
      background: rgba(255,255,255,.18);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
    }

    /* MAIN */

    main {
      max-width: 900px;
      margin: auto;
      padding: 15px 14px 90px;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 21px;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      color: #999;
    }

    /* SCHEDULE */

    .day-title {
      background: #dcfce7;
      color: #166534;
      padding: 12px 14px;
      border-radius: 13px;
      font-weight: bold;
      margin: 10px 0;
    }

    .schedule-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 9px;
      border-left: 4px solid #22c55e;
      box-shadow: 0 2px 7px rgba(0,0,0,.05);
    }

    .schedule-time {
      color: #16a34a;
      font-size: 13px;
      font-weight: bold;
    }

    .schedule-location {
      font-weight: bold;
      font-size: 16px;
      margin: 5px 0;
    }

    .schedule-detail {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .schedule-note {
      background: #fff7ed;
      color: #9a3412;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 13px;
    }

    /* MEMBERS */

    .member-card {
      background: white;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 9px;
      box-shadow: 0 2px 7px rgba(0,0,0,.05);
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .member-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .member-name {
      font-size: 16px;
      font-weight: bold;
    }

    .note-input {
      width: 100%;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
    }

    .save-member {
      margin-top: 8px;
      border: 0;
      background: #166534;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* EXPENSE */

    .expense-summary {
      background: #166534;
      color: white;
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 15px;
    }

    .expense-summary-label {
      font-size: 13px;
      opacity: .85;
    }

    .expense-total {
      font-size: 27px;
      font-weight: bold;
      margin-top: 4px;
    }

    .expense-card {
      background: white;
      border-radius: 13px;
      padding: 13px;
      margin-bottom: 9px;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-description {
      font-weight: bold;
    }

    .expense-amount {
      color: #dc2626;
      font-weight: bold;
      white-space: nowrap;
    }

    .expense-meta {
      color: #777;
      font-size: 12px;
      margin-top: 6px;
    }

    .expense-note {
      color: #555;
      font-size: 13px;
      margin-top: 6px;
    }

    /* BUTTON */

    .add-btn {
      border: 0;
      background: #166534;
      color: white;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: bold;
    }

    /* FORM */

    .form-card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .form-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      background: white;
    }

    .form-group textarea {
      min-height: 70px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    .primary-btn {
      flex: 1;
      border: 0;
      background: #166534;
      color: white;
      padding: 10px;
      border-radius: 9px;
      font-weight: bold;
    }

    .secondary-btn {
      border: 0;
      background: #e5e7eb;
      padding: 10px 14px;
      border-radius: 9px;
    }

    /* CHECKLIST */

    .checklist-card {
      background: white;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checklist-card input {
      width: 20px;
      height: 20px;
      accent-color: #16a34a;
    }

    .checklist-text {
      flex: 1;
    }

    .checklist-text.done {
      color: #999;
      text-decoration: line-through;
    }

    .delete-check {
      border: 0;
      background: #fee2e2;
      color: #dc2626;
      width: 31px;
      height: 31px;
      border-radius: 8px;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #ddd;
      z-index: 30;
    }

    .nav-inner {
      max-width: 900px;
      height: 100%;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      border: 0;
      background: white;
      color: #999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      font-size: 11px;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>


<body>

<header class="header">
  <div class="header-inner">

    <div>
      <div class="title">🌴 AG Trip</div>
      <div class="subtitle">An Giang • 10–11/10/2026</div>
    </div>

    <button class="refresh-btn" onclick="loadAll()">
      ↻
    </button>

  </div>
</header>


<main>

  <!-- LỊCH TRÌNH -->
  <section id="tab-schedule" class="tab active">

    <div class="section-header">
      <h2 class="section-title">🗺️ Lịch trình</h2>
    </div>

    <div id="schedule-content">
      <div class="loading">Đang tải...</div>
    </div>

  </section>


  <!-- THÀNH VIÊN -->
  <section id="tab-members" class="tab">

    <div class="section-header">
      <h2 class="section-title">👥 Thành viên</h2>
    </div>

    <div id="members-content">
      <div class="loading">Đang tải...</div>
    </div>

  </section>


  <!-- CHI TIÊU -->
  <section id="tab-expenses" class="tab">

    <div class="section-header">

      <h2 class="section-title">💰 Chi tiêu</h2>

      <button class="add-btn" onclick="showExpenseForm()">
        + Thêm
      </button>

    </div>

    <div id="expense-form-container"></div>

    <div id="expenses-content">
      <div class="loading">Đang tải...</div>
    </div>

  </section>


  <!-- CHECKLIST -->
  <section id="tab-checklist" class="tab">

    <div class="section-header">

      <h2 class="section-title">🎒 Checklist</h2>

      <button class="add-btn" onclick="showChecklistForm()">
        + Thêm
      </button>

    </div>

    <div id="checklist-form-container"></div>

    <div id="checklist-content">
      <div class="loading">Đang tải...</div>
    </div>

  </section>

</main>


<!-- NAV -->

<nav class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-btn active"
      onclick="switchTab('schedule', this)"
    >
      <span class="nav-icon">🗺️</span>
      Lịch trình
    </button>

    <button
      class="nav-btn"
      onclick="switchTab('members', this)"
    >
      <span class="nav-icon">👥</span>
      Thành viên
    </button>

    <button
      class="nav-btn"
      onclick="switchTab('expenses', this)"
    >
      <span class="nav-icon">💰</span>
      Chi tiêu
    </button>

    <button
      class="nav-btn"
      onclick="switchTab('checklist', this)"
    >
      <span class="nav-icon">🎒</span>
      Checklist
    </button>

  </div>

</nav>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzjrWg18zOpry0s4GlxBhyVT2OvdiCU4p6w6DFTR4lNqJTsp6aw_mbt6nJecV60GCVx/exec';


let appData = {
  schedule: [],
  members: [],
  expenses: [],
  checklist: []
};


/* =========================
   LOAD
========================= */

document.addEventListener(
  'DOMContentLoaded',
  loadAll
);


async function loadAll() {

  try {

    const response =
      await fetch(API_URL + '?action=all');

    const data =
      await response.json();


    console.log('API:', data);


    if (!data.success) {
      throw new Error(
        data.error || 'API error'
      );
    }


    appData.schedule =
      data.schedule &&
      data.schedule.rows
        ? data.schedule.rows
        : [];


    appData.members =
      data.members &&
      data.members.rows
        ? data.members.rows
        : [];


    appData.expenses =
      data.expenses &&
      data.expenses.rows
        ? data.expenses.rows
        : [];


    appData.checklist =
      data.checklist &&
      data.checklist.rows
        ? data.checklist.rows
        : [];


    renderSchedule();
    renderMembers();
    renderExpenses();
    renderChecklist();


  } catch (error) {

    console.error(
      'LOAD ERROR:',
      error
    );


    document.getElementById(
      'schedule-content'
    ).innerHTML =
      '<div class="empty">Không tải được dữ liệu.</div>';


    document.getElementById(
      'members-content'
    ).innerHTML =
      '<div class="empty">Không tải được dữ liệu.</div>';


    document.getElementById(
      'expenses-content'
    ).innerHTML =
      '<div class="empty">Không tải được dữ liệu.</div>';


    document.getElementById(
      'checklist-content'
    ).innerHTML =
      '<div class="empty">Không tải được dữ liệu.</div>';
  }
}


/* =========================
   TAB
========================= */

function switchTab(name, button) {

  document
    .querySelectorAll('.tab')
    .forEach(
      x => x.classList.remove('active')
    );


  document
    .getElementById(
      'tab-' + name
    )
    .classList.add('active');


  document
    .querySelectorAll('.nav-btn')
    .forEach(
      x => x.classList.remove('active')
    );


  button.classList.add('active');
}


/* =========================
   SCHEDULE
========================= */

function renderSchedule() {

  const box =
    document.getElementById(
      'schedule-content'
    );


  let html = '';


  for (
    let i = 1;
    i < appData.schedule.length;
    i++
  ) {

    const row =
      appData.schedule[i];


    if (!row) continue;


    const time =
      String(row[0] ?? '').trim();

    const location =
      String(row[1] ?? '').trim();

    const detail =
      String(row[2] ?? '').trim();

    const note =
      String(row[5] ?? '').trim();


    if (
      !time &&
      !location &&
      !detail
    ) {
      continue;
    }


    if (
      time.toUpperCase()
        .startsWith('DAY')
    ) {

      html +=
        '<div class="day-title">' +
        escapeHtml(time) +
        '</div>';

      continue;
    }


    html += `
      <div class="schedule-card">

        <div class="schedule-time">
          ${escapeHtml(time)}
        </div>

        <div class="schedule-location">
          ${escapeHtml(location)}
        </div>

        <div class="schedule-detail">
          ${escapeHtml(detail)}
        </div>

        ${
          note
            ? `
              <div class="schedule-note">
                📝 ${escapeHtml(note)}
              </div>
            `
            : ''
        }

      </div>
    `;
  }


  box.innerHTML =
    html ||
    '<div class="empty">Chưa có lịch trình.</div>';
}


/* =========================
   MEMBERS
========================= */

function renderMembers() {

  const box =
    document.getElementById(
      'members-content'
    );


  let html = '';
  let number = 1;


  for (
    let i = 1;
    i < appData.members.length;
    i++
  ) {

    const row =
      appData.members[i];


    if (!row) continue;


    const name =
      String(row[1] ?? '').trim();


    if (!name) continue;


    const note =
      String(row[2] ?? '');


    const sheetRow =
      i + 1;


    html += `
      <div
        class="member-card"
        data-row="${sheetRow}"
      >

        <div class="member-row">

          <div class="member-number">
            ${number}
          </div>

          <div class="member-name">
            ${escapeHtml(name)}
          </div>

        </div>


        <input
          class="note-input member-note"
          value="${escapeAttribute(note)}"
          placeholder="Note..."
        >


        <button
          class="save-member"
          onclick="saveMember(this)"
        >
          💾 Lưu
        </button>

      </div>
    `;


    number++;
  }


  box.innerHTML =
    html ||
    '<div class="empty">Chưa có thành viên.</div>';
}


async function saveMember(button) {

  const card =
    button.closest('.member-card');


  const row =
    Number(card.dataset.row);


  const note =
    card.querySelector(
      '.member-note'
    ).value;


  button.disabled = true;
  button.textContent = 'Đang lưu...';


  try {

    const response =
      await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'updateMember',
          row: row,
          note: note
        })
      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.error || 'Lỗi'
      );
    }


    button.textContent = '✓ Đã lưu';


    setTimeout(
      () => {
        button.textContent = '💾 Lưu';
        button.disabled = false;
      },
      1000
    );


  } catch (error) {

    console.error(error);

    alert(
      'Không lưu được ghi chú.'
    );

    button.textContent = '💾 Lưu';
    button.disabled = false;
  }
}


/* =========================
   EXPENSES
========================= */

function renderExpenses() {

  const box =
    document.getElementById(
      'expenses-content'
    );


  let total = 0;
  let html = '';


  for (
    let i = 1;
    i < appData.expenses.length;
    i++
  ) {

    const row =
      appData.expenses[i];


    if (!row) continue;


    const time =
      row[0] ?? '';

    const description =
      String(row[1] ?? '').trim();

    const amount =
      Number(row[2]) || 0;

    const payer =
      String(row[3] ?? '').trim();

    const note =
      String(row[4] ?? '').trim();


    if (
      !description &&
      !amount &&
      !payer
    ) {
      continue;
    }


    total += amount;


    html += `
      <div class="expense-card">

        <div class="expense-top">

          <div class="expense-description">
            ${escapeHtml(
              description || 'Khoản chi'
            )}
          </div>

          <div class="expense-amount">
            ${formatMoney(amount)}
          </div>

        </div>

        <div class="expense-meta">
          ${escapeHtml(
            formatDateTime(time)
          )}
          ${
            payer
              ? ' • ' +
                escapeHtml(payer)
              : ''
          }
        </div>

        ${
          note
            ? `
              <div class="expense-note">
                ${escapeHtml(note)}
              </div>
            `
            : ''
        }

      </div>
    `;
  }


  box.innerHTML = `

    <div class="expense-summary">

      <div class="expense-summary-label">
        Tổng chi tiêu
      </div>

      <div class="expense-total">
        ${formatMoney(total)}
      </div>

    </div>

    ${
      html ||
      '<div class="empty">Chưa có khoản chi nào.</div>'
    }

  `;
}


/* =========================
   EXPENSE FORM
========================= */

function showExpenseForm() {

  const box =
    document.getElementById(
      'expense-form-container'
    );


  let options =
    '<option value="">-- Người trả --</option>';


  for (
    let i = 1;
    i < appData.members.length;
    i++
  ) {

    const name =
      String(
        appData.members[i]?.[1] ?? ''
      ).trim();


    if (name) {

      options += `
        <option value="${escapeAttribute(name)}">
          ${escapeHtml(name)}
        </option>
      `;
    }
  }


  box.innerHTML = `

    <div class="form-card">

      <div class="form-title">
        ➕ Thêm khoản chi
      </div>

      <form onsubmit="submitExpense(event)">

        <div class="form-group">

          <label>Thời gian</label>

          <input
            id="expense-time"
            type="datetime-local"
            value="${getCurrentDateTime()}"
          >

        </div>


        <div class="form-group">

          <label>Nội dung</label>

          <input
            id="expense-description"
            placeholder="Ví dụ: Mua bia"
            required
          >

        </div>


        <div class="form-group">

          <label>Số tiền</label>

          <input
            id="expense-amount"
            type="number"
            min="0"
            placeholder="500000"
            required
          >

        </div>


        <div class="form-group">

          <label>Người trả</label>

          <select id="expense-payer">
            ${options}
          </select>

        </div>


        <div class="form-group">

          <label>Ghi chú</label>

          <textarea
            id="expense-note"
            placeholder="Không bắt buộc"
          ></textarea>

        </div>


        <div class="form-actions">

          <button
            class="primary-btn"
            type="submit"
          >
            Lưu
          </button>

          <button
            class="secondary-btn"
            type="button"
            onclick="hideExpenseForm()"
          >
            Hủy
          </button>

        </div>

      </form>

    </div>
  `;
}


function hideExpenseForm() {

  document.getElementById(
    'expense-form-container'
  ).innerHTML = '';
}


async function submitExpense(event) {

  event.preventDefault();


  const data = {

    action: 'addExpense',

    time:
      document.getElementById(
        'expense-time'
      ).value,

    description:
      document.getElementById(
        'expense-description'
      ).value.trim(),

    amount:
      Number(
        document.getElementById(
          'expense-amount'
        ).value
      ),

    payer:
      document.getElementById(
        'expense-payer'
      ).value,

    note:
      document.getElementById(
        'expense-note'
      ).value.trim()
  };


  try {

    const response =
      await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body: JSON.stringify(data)
      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.error || 'Lỗi'
      );
    }


    hideExpenseForm();

    await loadAll();


  } catch (error) {

    console.error(error);

    alert(
      'Không thêm được khoản chi.'
    );
  }
}


/* =========================
   CHECKLIST
========================= */

function renderChecklist() {

  const box =
    document.getElementById(
      'checklist-content'
    );


  let html = '';


  for (
    let i = 0;
    i < appData.checklist.length;
    i++
  ) {

    const row =
      appData.checklist[i];


    if (!row) continue;


    const raw =
      String(row[0] ?? '').trim();


    if (!raw) continue;


    const checked =
      raw.startsWith('✓ ');


    const text =
      checked
        ? raw.substring(2)
        : raw;


    const sheetRow =
      i + 1;


    html += `

      <div class="checklist-card">

        <input
          type="checkbox"
          ${checked ? 'checked' : ''}
          onchange='toggleChecklist(
            ${sheetRow},
            this.checked,
            ${JSON.stringify(text)}
          )'
        >

        <div
          class="checklist-text ${
            checked ? 'done' : ''
          }"
        >
          ${escapeHtml(text)}
        </div>

        <button
          class="delete-check"
          onclick="deleteChecklist(${sheetRow})"
        >
          ×
        </button>

      </div>
    `;
  }


  box.innerHTML =
    html ||
    '<div class="empty">Chưa có checklist.</div>';
}


async function toggleChecklist(
  row,
  checked,
  text
) {

  const value =
    checked
      ? '✓ ' + text
      : text;


  try {

    const response =
      await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'updateChecklist',
          row: row,
          value: value
        })
      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.error || 'Lỗi'
      );
    }


    await loadAll();


  } catch (error) {

    console.error(error);

    alert(
      'Không cập nhật được checklist.'
    );

    await loadAll();
  }
}


/* =========================
   CHECKLIST FORM
========================= */

function showChecklistForm() {

  const box =
    document.getElementById(
      'checklist-form-container'
    );


  box.innerHTML = `

    <div class="form-card">

      <div class="form-title">
        ➕ Thêm checklist
      </div>

      <form onsubmit="submitChecklist(event)">

        <div class="form-group">

          <label>Món cần chuẩn bị</label>

          <input
            id="checklist-item"
            placeholder="Ví dụ: Kem chống nắng"
            required
            autofocus
          >

        </div>


        <div class="form-actions">

          <button
            class="primary-btn"
            type="submit"
          >
            Thêm
          </button>

          <button
            class="secondary-btn"
            type="button"
            onclick="hideChecklistForm()"
          >
            Hủy
          </button>

        </div>

      </form>

    </div>
  `;
}


function hideChecklistForm() {

  document.getElementById(
    'checklist-form-container'
  ).innerHTML = '';
}


async function submitChecklist(event) {

  event.preventDefault();


  const item =
    document.getElementById(
      'checklist-item'
    ).value.trim();


  try {

    const response =
      await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'addChecklist',
          item: item
        })
      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.error || 'Lỗi'
      );
    }


    hideChecklistForm();

    await loadAll();


  } catch (error) {

    console.error(error);

    alert(
      'Không thêm được checklist.'
    );
  }
}


/* =========================
   DELETE CHECKLIST
========================= */

async function deleteChecklist(row) {

  if (
    !confirm(
      'Xóa món này khỏi checklist?'
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'deleteChecklist',
          row: row
        })
      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.error || 'Lỗi'
      );
    }


    await loadAll();


  } catch (error) {

    console.error(error);

    alert(
      'Không xóa được checklist.'
    );
  }
}


/* =========================
   HELPERS
========================= */

function formatMoney(value) {

  return (
    new Intl.NumberFormat(
      'vi-VN'
    ).format(
      Number(value) || 0
    ) + ' ₫'
  );
}


function formatDateTime(value) {

  if (!value) return '';


  const date =
    new Date(value);


  if (
    !isNaN(
      date.getTime()
    )
  ) {

    return date.toLocaleString(
      'vi-VN'
    );
  }


  return String(value);
}


function getCurrentDateTime() {

  const now =
    new Date();


  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2, '0');

  const d =
    String(
      now.getDate()
    ).padStart(2, '0');

  const h =
    String(
      now.getHours()
    ).padStart(2, '0');

  const min =
    String(
      now.getMinutes()
    ).padStart(2, '0');


  return (
    y + '-' +
    m + '-' +
    d + 'T' +
    h + ':' +
    min
  );
}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


function escapeAttribute(value) {

  return escapeHtml(value);
}
